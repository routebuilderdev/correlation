[package]
name = "correlation"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` is required for env::ecrecover in near-sdk 5.30 — it is not
# exported otherwise, and the contract cannot verify ECDSA without it (D5).
near-sdk = { version = "5.30", features = ["legacy", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["legacy", "unstable", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
